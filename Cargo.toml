[workspace]
resolver = "2"
members = [
    "crates/core",
    "adapters/persistence",
    "adapters/sources/csv",
    "adapters/sources/webhook",
    "apps/server",
    "apps/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"

[workspace.dependencies]
ops-core = { path = "crates/core" }
ops-persistence = { path = "adapters/persistence" }
ops-source-csv = { path = "adapters/sources/csv" }
ops-source-webhook = { path = "adapters/sources/webhook" }

anyhow = "1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
